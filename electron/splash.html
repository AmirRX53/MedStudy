<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedStudy</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Inter, system-ui, sans-serif;
        background: #0f1117;
        color: #f3f4f6;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.2), transparent 42%),
          radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.16), transparent 45%),
          #0f1117;
      }

      .splash {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        user-select: none;
      }

      .logo {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        box-shadow: 0 16px 38px rgba(59, 130, 246, 0.3);
        font-size: 36px;
      }

      h1 {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.4px;
      }

      p {
        margin: 0;
        color: #9ca3af;
        font-size: 13px;
      }

      .spinner {
        width: 24px;
        height: 24px;
        margin-top: 8px;
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="MedStudy is loading">
      <div class="logo" aria-hidden="true">🏥</div>
      <h1>MedStudy</h1>
      <p>Preparing your study space…</p>
      <div class="spinner" aria-hidden="true"></div>
    </main>
  </body>
</html>
